<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 的发展 · 小红书封面</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Inter:wght@200;300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;background:#1a1a2e;
  font-family:'Noto Sans SC','Inter',sans-serif;
}

/* ─── 小红书封面 3:4 ─── */
.poster{
  width:1080px;height:1440px;
  background:linear-gradient(160deg, #0A0A1A 0%, #1A1A3E 30%, #0D0D2A 60%, #0A0A1A 100%);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;padding:80px 72px;
}

/* ─── 装饰网格 ─── */
.poster::before{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background-image:
    linear-gradient(rgba(100,140,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100,140,255,0.03) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at 50% 40%, black 30%, transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%, black 30%, transparent 70%);
}

/* ─── 装饰光晕 ─── */
.glow-1{
  position:absolute;top:-20%;right:-10%;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(80,120,255,0.12), transparent 60%);
  border-radius:50%;
  animation:pulse1 6s ease-in-out infinite;
}
.glow-2{
  position:absolute;bottom:-15%;left:-10%;
  width:500px;height:500px;
  background:radial-gradient(circle, rgba(120,80,255,0.08), transparent 60%);
  border-radius:50%;
  animation:pulse2 8s ease-in-out infinite;
}
@keyframes pulse1{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse2{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:0.8;transform:scale(1.15)}}

/* ─── 浮动粒子 ─── */
.dots{
  position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;
}
.dot{
  position:absolute;border-radius:50%;background:rgba(100,140,255,0.15);
}
.dot:nth-child(1){width:4px;height:4px;top:12%;left:15%;animation:float1 7s ease-in-out infinite}
.dot:nth-child(2){width:6px;height:6px;top:25%;right:20%;animation:float1 9s ease-in-out infinite 1s}
.dot:nth-child(3){width:3px;height:3px;top:40%;left:8%;animation:float1 6s ease-in-out infinite 2s}
.dot:nth-child(4){width:5px;height:5px;bottom:30%;right:12%;animation:float1 8s ease-in-out infinite 0.5s}
.dot:nth-child(5){width:8px;height:8px;bottom:15%;left:25%;animation:float1 10s ease-in-out infinite 3s}
.dot:nth-child(6){width:4px;height:4px;top:60%;right:30%;animation:float1 7s ease-in-out infinite 1.5s}
@keyframes float1{
  0%,100%{transform:translateY(0) scale(1);opacity:0.5}
  50%{transform:translateY(-20px) scale(1.3);opacity:0.8}
}

/* ─── 装饰线条 ─── */
.line-deco{
  position:absolute;top:0;right:0;width:300px;height:100%;
  overflow:hidden;pointer-events:none;
}
.line-deco span{
  position:absolute;right:-20px;
  width:1px;height:30%;background:linear-gradient(to bottom, transparent, rgba(100,140,255,0.06), transparent);
}
.line-deco span:nth-child(1){top:10%;right:40px;height:40%}
.line-deco span:nth-child(2){top:25%;right:80px;height:25%}
.line-deco span:nth-child(3){top:50%;right:120px;height:35%}

/* ─── 内容 ─── */
.content{position:relative;z-index:2}

.tag{
  display:inline-block;
  font-size:14px;font-weight:400;letter-spacing:0.15em;
  color:rgba(100,160,255,0.7);
  margin-bottom:24px;
  border:1px solid rgba(100,160,255,0.15);
  padding:8px 20px;
  border-radius:2px;
  text-transform:uppercase;
}

h1{
  font-size:92px;font-weight:900;line-height:1.05;
  color:#FFFFFF;
  letter-spacing:-0.03em;
  margin-bottom:8px;
}
h1 .highlight{
  background:linear-gradient(135deg, #6490FF, #A080FF, #6490FF);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease-in-out infinite;
}
@keyframes gradientShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.subtitle{
  font-size:28px;font-weight:300;color:rgba(255,255,255,0.4);
  letter-spacing:0.08em;margin-bottom:48px;
  line-height:1.4;
}

/* ─── 分隔线 ─── */
.divider{
  width:80px;height:2px;
  background:linear-gradient(90deg, rgba(100,160,255,0.5), transparent);
  margin-bottom:40px;
}

/* ─── 关键词 ─── */
.tags-row{
  display:flex;gap:12px;flex-wrap:wrap;margin-bottom:56px;
}
.keyword{
  font-size:13px;font-weight:400;color:rgba(255,255,255,0.5);
  border:1px solid rgba(255,255,255,0.08);
  padding:8px 18px;border-radius:20px;
  letter-spacing:0.03em;
  transition:all 0.3s;
}
.keyword:nth-child(1){border-color:rgba(100,160,255,0.2);color:rgba(100,160,255,0.7)}

/* ─── 底部 ─── */
.footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;padding-top:32px;
}
.footer-left{
  display:flex;align-items:center;gap:12px;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg, #6490FF, #A080FF);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:600;
}
.footer-text{font-size:13px;color:rgba(255,255,255,0.3);letter-spacing:0.03em}
.footer-text strong{color:rgba(255,255,255,0.5);font-weight:500}

.footer-right{
  display:flex;align-items:center;gap:24px;
}
.stat{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.25)}
.stat-icon{opacity:0.3}

/* ─── 二维码装饰 ─── */
.qr-placeholder{
  width:56px;height:56px;
  border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:rgba(255,255,255,0.15);letter-spacing:0.02em;
}

/* ─── 底部渐变 ─── */
.bottom-gradient{
  position:absolute;bottom:0;left:0;right:0;height:200px;
  background:linear-gradient(to top, rgba(10,10,26,0.6), transparent);
  pointer-events:none;
}
</style>
</head>
<body>

<div class="poster">

  <!-- 装饰 -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="dots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <div class="line-deco">
    <span></span><span></span><span></span>
  </div>

  <div class="content">

    <!-- 标签 -->
    <div class="tag">✦ 深度观察</div>

    <!-- 标题 -->
    <h1>AI 的<br><span class="highlight">发展与未来</span></h1>
    <div class="subtitle">从 GPT 到 AGI，我们站在哪里？</div>

    <!-- 分隔线 -->
    <div class="divider"></div>

    <!-- 关键词 -->
    <div class="tags-row">
      <span class="keyword">大语言模型</span>
      <span class="keyword">多模态</span>
      <span class="keyword">AGI</span>
      <span class="keyword">具身智能</span>
      <span class="keyword">AI Agent</span>
      <span class="keyword">推理能力</span>
    </div>

  </div>

  <!-- 底部 -->
  <div class="footer" style="position:relative;z-index:2">
    <div class="footer-left">
      <div class="avatar">B</div>
      <div class="footer-text">
        <strong>BWVI Design</strong><br>
        设计驱动 · 思考可视
      </div>
    </div>
    <div class="footer-right">
      <span class="stat"><span class="stat-icon">♥</span> 2.4k</span>
      <span class="stat"><span class="stat-icon">★</span> 892</span>
      <div class="qr-placeholder">BWVI</div>
    </div>
  </div>

  <div class="bottom-gradient"></div>
</div>

</body>
</html>
