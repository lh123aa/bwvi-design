<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>linear — Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{--color-primary:#5E6AD2;--color-accent:#E2E8F0;--color-surface:#FFFFFF;--color-text:#1A202C;--font-display:'Inter',sans-serif}
  :root{--color-surface:#1a1a1a;--color-text:#e0e0e0}
  @page { margin: 0; size: 4961px 7016px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 4961px; height: 7016px;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .poster-canvas {
    width: 4961px; height: 7016px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #FFFFFF; color: var(--color-text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 5%; text-align: center;
    position: relative; overflow: hidden;
  }
  .poster-accent-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 2.5%; background: #E2E8F0;
  }
  .poster-accent-corner {
    position: absolute; bottom: 4%; right: 4%;
    width: 8%; height: 8%;
    border: 2px solid #E2E8F040;
    border-radius: 4px;
  }
  .poster-title {
    font-family: var(--font-display);
    font-size: clamp(3rem, 10vw, 12rem);
    font-weight: 800; line-height: 1.1;
    letter-spacing: -0.03em;
    color: #5E6AD2;
    margin-bottom: 0.4em;
    max-width: 85%;
  }
  .poster-subtitle {
    font-size: clamp(1.2rem, 3.5vw, 4rem);
    font-weight: 400; line-height: 1.4;
    color: var(--color-text); opacity: 0.6;
    margin-bottom: 0.8em;
    max-width: 70%;
  }
  .poster-desc {
    font-size: clamp(0.8rem, 2vw, 2.2rem);
    font-weight: 300; line-height: 1.6;
    color: var(--color-text); opacity: 0.5;
    margin-bottom: 1.2em;
    max-width: 60%;
  }
  .poster-cta {
    display: inline-block;
    padding: 0.6em 2em;
    font-size: clamp(0.7rem, 1.8vw, 2rem);
    font-weight: 600;
    background: #E2E8F0;
    color: #1a1a1a;
    border: none; border-radius: 0.3em;
    text-decoration: none;
    cursor: default;
  }
  .poster-brand {
    position: absolute; bottom: 4%;
    font-size: clamp(0.5rem, 1.2vw, 1.4rem);
    color: #5E6AD240;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="poster-canvas">
  <div class="poster-accent-bar"></div>
  <div class="poster-accent-corner"></div>
  <div class="poster-title">linear</div>
  <div class="poster-subtitle">Conference 2026</div>
  <div class="poster-desc">Premium quality designed for modern needs.</div>
  <div class="poster-cta">Conference 2026</div>
  <div class="poster-brand">linear</div>
</div>
</body>
</html>
