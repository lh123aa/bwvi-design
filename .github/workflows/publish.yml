name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        run: npm publish || echo "⚠️ npm publish skipped — NPM_TOKEN not configured"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
